name: "Production deploy"
description: "Back up the current Shopify production theme, then push the built theme from the caller workspace"
author: "Pixelcabin"

branding:
  icon: "upload-cloud"
  color: "blue"

inputs:
  environment-target:
    description: "shopify.theme.toml environment name and GitHub Environment name"
    required: true
  path:
    description: "Path to theme files in the caller repo"
    required: false
    default: "."
  slack-webhook:
    description: "Slack incoming webhook URL for job status"
    required: false
  shopify-cli-version:
    description: "Shopify CLI version to install"
    required: false
    default: "4.8.0"

runs:
  using: "composite"
  steps:
    - name: Install Shopify CLI
      run: npm install -g @shopify/cli@${{ inputs.shopify-cli-version }}
      shell: bash

    - name: Read theme ID from shopify.theme.toml
      id: theme
      run: |
        THEME_ID=$(awk -v env="environments.${{ inputs.environment-target }}" '
          $0 == "[" env "]" { capture=1; next }
          $0 ~ /^\[/ { capture=0 }
          capture && /^theme[[:space:]]*=/ { gsub(/[^0-9]/, ""); print; exit }
        ' shopify.theme.toml)
        echo "theme-id=${THEME_ID}" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Get backup theme name
      id: backup-name
      run: |
        ENV="${{ inputs.environment-target }}"
        THEME_ID="${{ steps.theme.outputs.theme-id }}"
        if [[ -z "$THEME_ID" ]]; then
          echo "No theme id in shopify.theme.toml for environment ${ENV}"
          exit 1
        fi
        RAW=$(shopify theme list -e="$ENV" --id="$THEME_ID" --json 2>/dev/null || true)
        JSON=$(printf '%s\n' "$RAW" | sed -n '/^[[:space:]]*[[{]/,$p')
        THEME_NAME=$(printf '%s\n' "$JSON" | jq -r 'if type == "array" then .[0].name else .name end' 2>/dev/null || true)
        if [[ -z "$THEME_NAME" || "$THEME_NAME" == "null" ]]; then
          echo "No theme named for id ${THEME_ID} in environment ${ENV}"
          exit 1
        fi
        NAME=$(printf 'Backup of %s' "$THEME_NAME" | cut -c1-50)
        echo "backup-theme-name=${NAME}" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Duplicate production theme as backup
      env:
        BACKUP_THEME_NAME: ${{ steps.backup-name.outputs.backup-theme-name }}
      run: |
        shopify theme duplicate \
          -e="${{ inputs.environment-target }}" \
          -t="${{ steps.theme.outputs.theme-id }}" \
          -n="$BACKUP_THEME_NAME" \
          --force
      shell: bash

    - name: Push theme to production
      run: shopify theme push -a -e="${{ inputs.environment-target }}" --path="${{ inputs.path }}"
      shell: bash

    - uses: 8398a7/action-slack@v3
      if: ${{ inputs.slack-webhook != '' }}
      with:
        status: ${{ job.status }}
        fields: repo,author,workflow,job
      env:
        SLACK_WEBHOOK_URL: ${{ inputs.slack-webhook }}
