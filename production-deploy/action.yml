name: "Production deploy"
description: "Back up the current Shopify production theme, then push the built theme from the caller workspace"
author: "Pixelcabin"

branding:
  icon: "upload-cloud"
  color: "blue"

inputs:
  environment-target:
    description: "shopify.theme.toml environment name and GitHub Environment name"
    required: true
  path:
    description: "Path to theme files in the caller repo"
    required: false
    default: "."
  slack-webhook:
    description: "Slack incoming webhook URL. Posts a deploy summary when set."
    required: false
  shopify-cli-version:
    description: "Shopify CLI version to install"
    required: false
    default: "4.8.0"

runs:
  using: "composite"
  steps:
    - name: Install Shopify CLI
      run: npm install -g @shopify/cli@${{ inputs.shopify-cli-version }}
      shell: bash

    - name: Read theme ID from shopify.theme.toml
      id: theme
      env:
        ENVIRONMENT_TARGET: ${{ inputs.environment-target }}
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/scripts/get-environment-theme-id.sh"

    - name: Get theme name
      id: theme-name
      env:
        ENVIRONMENT_TARGET: ${{ inputs.environment-target }}
        THEME_ID: ${{ steps.theme.outputs.theme-id }}
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/scripts/get-theme-name-from-id.sh"

    - name: Get backup theme name
      id: backup-name
      env:
        THEME_NAME: ${{ steps.theme-name.outputs.theme-name }}
      shell: bash
      run: |
        STAMP=$(date -u +'%Y-%m-%d %H:%M')
        SUFFIX=" (${STAMP})"
        PREFIX="Backup of "
        MAX_THEME_LEN=$((50 - ${#PREFIX} - ${#SUFFIX}))
        SHORT_THEME=$(printf '%s' "$THEME_NAME" | cut -c1-"$MAX_THEME_LEN")
        NAME="${PREFIX}${SHORT_THEME}${SUFFIX}"
        echo "backup-theme-name=${NAME}" >> "$GITHUB_OUTPUT"

    - name: Duplicate production theme as backup
      env:
        BACKUP_THEME_NAME: ${{ steps.backup-name.outputs.backup-theme-name }}
      run: |
        shopify theme duplicate \
          -e="${{ inputs.environment-target }}" \
          -t="${{ steps.theme.outputs.theme-id }}" \
          -n="$BACKUP_THEME_NAME" \
          --force
      shell: bash

    - name: Push theme to production
      run: shopify theme push -a -e="${{ inputs.environment-target }}" --path="${{ inputs.path }}"
      shell: bash

    - name: Read package version
      id: package-version
      if: ${{ !cancelled() }}
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/scripts/get-package-version.sh"

    - name: Notify Slack
      if: ${{ inputs.slack-webhook != '' && !cancelled() }}
      uses: slackapi/slack-github-action@v4
      with:
        webhook: ${{ inputs.slack-webhook }}
        webhook-type: incoming-webhook
        payload: |
          text: "Production deploy ${{ job.status }} for ${{ inputs.environment-target }}"
          blocks:
            - type: section
              text:
                type: mrkdwn
                text: "*Production deploy ${{ job.status }}*\n*Environment:* `${{ inputs.environment-target }}`\n*Version:* ${{ steps.package-version.outputs.version || 'unknown' }}\n*Theme:* ${{ steps.theme-name.outputs.theme-name }} (`${{ steps.theme.outputs.theme-id }}`)\n*Backup:* ${{ steps.backup-name.outputs.backup-theme-name }}\n*Repository:* <${{ github.server_url }}/${{ github.repository }}|${{ github.server_url }}/${{ github.repository }}>"
            - type: context
              elements:
                - type: mrkdwn
                  text: "${{ github.workflow }} · ${{ github.actor }} · <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
